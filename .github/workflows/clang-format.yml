name: test-clang-format
on: [push,pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format-checking:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-format-19
        run: sudo apt-get install -y clang-format-19
      - name: Check formatting
        run: |
          # find all project-owned headers and sources, skipping build output
          FILES=$(find . \( -name '*.h' -o -name '*.cpp' \) \
            ! -path './.git/*' \
            ! -path './build/*' \
            ! -path './tests/bin/*')
          echo "$FILES" | wc -l | xargs -I{} echo "Checking {} files..."
          echo "$FILES" | xargs sed -i 's/\r//'
          echo "$FILES" | xargs clang-format-19 --dry-run --Werror
